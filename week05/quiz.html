<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | Basic HTML Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>

    <header>
        <h1>WDD 130 | Basic HTML Quiz</h1>
    </header>

    <main>

        <form>

            <div>
                <label for="q1">1. What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <div>
                <label for="q2">2. How are the id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2" rows="4" placeholder=""></textarea>
            </div>

            <div>
                <label for="q3">3. Which of the following is a valid CSS comment?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose One...</option>
                    <option value="wrong1">// This is a CSS comment</option>
                    <option value="correct">/* This is a CSS comment */</option>
                    <option value="wrong2">-- This is a CSS comment --</option>
                </select>
            </div>

            <div>
                <label for="q4">4. How many heading levels are available in HTML?</label>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit">Submit Quiz</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 - Lucio Boccazzi - Buenos Aires, Argentina</p>
    </footer>

</body>

</html>
