<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="">
</head>

<body>

    <header>
        <h1>WDD 130 | HTML Form User Poll</h1>
    </header>

    <main>

        <form>

            <h2>Contact Information:</h2>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" required>

            <h2>Questions</h2>

            <label for="favoritebrowser">What is your favorite browser?</label>
            <select name="favoritebrowser" id="favoritebrowser">
                <option value="chrome">Google Chrome</option>
                <option value="edge">Microsoft Edge</option>
                <option value="safari">Safari</option>
            </select>

            <label><input type="checkbox" id="pet" name="pet">Do you have a pet?</label>

            <label for="feedback">List the places you have lived in:</label>
            <textarea id="feedback" name="feedback" rows="4"
              placeholder="Argentina, Chile, USA"></textarea>

            <button type="submit">Submit Poll</button>
        </form>


    </main>

    <footer>
        <p>©️2026 - Lucio Boccazzi - Buenos Aires, Argentina</p>
    </footer>


</body>

</html>
