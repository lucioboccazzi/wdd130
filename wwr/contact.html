<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting - Contact Us Page</title>
    <meta name="description" content="This is page to contact the company">
    <meta name="author" content="Lucio Boccazzi">

    <link rel="stylesheet" href="styles/rafting.css">
    <link rel="stylesheet" href="styles/contactus.css">

</head>

<body>
    <header>
        <img src="images/logo-boat.png" alt="logo of the boat for the website">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>


        <div class="address-details">
            <h1>Rafting Through Wonders</h1>
            <p>123 Main River Street<br>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>

        <div class="grid-map">
            <section class="company-info">

                <div class="map-container">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509374!2d-122.4194155!3d37.7749295!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80858064bf5f5555%3A0x0!2zMzfCsDQ2JzI5LjciTiAxMjLCsDI1JzA5LjkiVw!5e0!3m2!1sen!2sus!4v1"
                      width="400" height="300" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </section>

            <section class="contact-form-section">
                <form action="#" method="post">
                    <div class="form-item">
                        <label for="username">Name</label>
                        <input type="text" id="username" name="username"
                          placeholder="Your Full Name" required>
                    </div>

                    <div class="form-item">
                        <label for="useremail">Email</label>
                        <input type="email" id="useremail" name="useremail"
                          placeholder="Your Email Address" required>
                    </div>

                    <fieldset>
                        <legend>Message Purpose</legend>
                        <label><input type="radio" id="general" name="purpose" value="general"
                              checked>
                            General
                            Inquiry</label>
                        <label><input type="radio" id="reservation" name="purpose"
                              value="reservation">
                            Reservation Question</label>
                        <label><input type="radio" id="suggestion" name="purpose"
                              value="suggestion">
                            Website
                            Suggestion</label>
                    </fieldset>

                    <div class="form-item">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5"
                          placeholder="Type here..."></textarea>
                    </div>

                    <div class="form-item checkbox-item">
                        <label for="newsletter">
                            <input type="checkbox" id="newsletter" name="newsletter"
                              value="subscribe">
                            Please subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </form>
            </section>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/jane-employee.jpg" alt="Jane Doe, Operations Manager">
                    <figcaption>Jane Doe - Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/john-employee.jpg" alt="John Smith, Lead River Guide">
                    <figcaption>John Smith - Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/alex-employee.jpg" alt="Alex Johnson, Safety Director">
                    <figcaption>Alex Johnson - Safety Director</figcaption>
                </figure>
            </div>
        </section>
    </main>


    </main>

    <footer>

        <p>©️2026 - Rafting Through Wonders - Lucio Boccazzi</p>

        <nav class="socialmedia">

            <a href="https://facebook.com."><img src="images/facebook-logo.png"
                  alt="Facebook Icon"></a>

            <a href="https://linkedin.com."><img src="images/linkedin-logo.png"
                  alt="LinkedIn Icon"></a>

            <a href="https://instagram.com."><img src="images/instagram-logo.png"
                  alt="Instagram Icon"></a>

        </nav>


    </footer>


</body>

</html>
